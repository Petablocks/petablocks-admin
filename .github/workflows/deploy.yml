name: Deploy Admin Portal to PETABLOCKS-FEA
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync to PETABLOCKS-FEA
        run: |
          # Sync source files, excluding build artefacts and modules
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='server/node_modules' \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ root@10.20.110.116:/opt/petablocks/admin/

      - name: Rebuild & Restart Admin Container
        run: |
          # Credentials live ONLY in /opt/petablocks/.env on the server (never in this repo).
          # Fail fast, without printing values, if a required variable is missing.
          ssh -o StrictHostKeyChecking=no root@10.20.110.116 '
            set -e
            ENV_FILE=/opt/petablocks/.env
            [ -f "$ENV_FILE" ] || { echo "Missing $ENV_FILE"; exit 1; }
            for v in API_SECRET_TOKEN MC_DB_USER MC_DB_PASSWORD; do
              grep -Eq "^${v}=.+" "$ENV_FILE" || { echo "Missing required variable in .env: $v"; exit 1; }
            done
            grep -Eq "^(MC_SSH_KEY|MC_SSH_PRIVATE_KEY|MC_SSH_KEY_FILE)=.+" "$ENV_FILE" || { echo "Missing cluster SSH key variable in .env"; exit 1; }
          '
          # Rebuild only the admin container and leave others untouched
          ssh -o StrictHostKeyChecking=no root@10.20.110.116 \
            "cd /opt/petablocks && docker compose up -d --build --no-deps admin"

      - name: Discord Notification
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          nofail: true
          ack_no_webhook: true
          content: "admin.petablocks.com has been updated"
          title: "⚡ Admin Portal Deployment"

      - name: 🖨️ Print Deploy Receipt
        if: always()
        run: |
          curl -s --max-time 5 -X POST http://10.95.0.185:8006/webhook/deploy \
            -H "Content-Type: application/json" \
            -d '{
              "project": ${{ toJson(github.repository) }},
              "status": "${{ job.status }}",
              "branch": "${{ github.ref_name }}",
              "commit": "${{ github.sha }}",
              "message": ${{ toJson(github.event.head_commit.message || '') }},
              "deployer": ${{ toJson(github.actor) }},
              "environment": "fea-admin",
              "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }' || true
