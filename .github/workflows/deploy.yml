name: Deploy Admin Portal to PETABLOCKS-FEA
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync to PETABLOCKS-FEA
        run: |
          # Sync source files, excluding build artefacts and modules
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='server/node_modules' \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ root@10.20.110.116:/opt/petablocks/admin/

      - name: Rebuild & Restart Admin Container
        run: |
          # Ensure cluster SSH key is configured in /opt/petablocks/.env if not already set
          ssh -o StrictHostKeyChecking=no root@10.20.110.116 '
            if [ -f /opt/petablocks/.env ]; then
              if ! grep -q "^MC_SSH_KEY=" /opt/petablocks/.env || grep -q "^MC_SSH_KEY=\"\"" /opt/petablocks/.env || grep -q "^MC_SSH_KEY=$" /opt/petablocks/.env; then
                sed -i "/^MC_SSH_KEY=/d" /opt/petablocks/.env
                printf "\nMC_SSH_KEY=\"-----BEGIN OPENSSH PRIVATE KEY-----\nb3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAAAMwAAAAtzc2gtZW\nQyNTUxOQAAACCK5B91oPhc74Q3AdMwmLpLG6hXVfEeNuQ5JZvyz3ndVgAAAJgVjzhhFY84\nYQAAAAtzc2gtZWQyNTUxOQAAACCK5B91oPhc74Q3AdMwmLpLG6hXVfEeNuQ5JZvyz3ndVg\nAAAECp+nVXQqH10GUgYHqZx6pBarI7yiqEv2H+pCrx0Zu8xYrkH3Wg+FzvhDcB0zCYuksb\nqFdV8R425Dklm/LPed1WAAAAFXBldGFibG9ja3MtbWNzLWFjY2Vzcw==\n-----END OPENSSH PRIVATE KEY-----\"\n" >> /opt/petablocks/.env
              fi
            fi
          '
          # Rebuild only the admin container and leave others untouched
          ssh -o StrictHostKeyChecking=no root@10.20.110.116 \
            "cd /opt/petablocks && docker compose up -d --build --no-deps admin"

      - name: Discord Notification
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          nofail: true
          ack_no_webhook: true
          content: "admin.petablocks.com has been updated"
          title: "⚡ Admin Portal Deployment"

      - name: 🖨️ Print Deploy Receipt
        if: always()
        run: |
          curl -s --max-time 5 -X POST http://10.95.0.185:8006/webhook/deploy \
            -H "Content-Type: application/json" \
            -d '{
              "project": ${{ toJson(github.repository) }},
              "status": "${{ job.status }}",
              "branch": "${{ github.ref_name }}",
              "commit": "${{ github.sha }}",
              "message": ${{ toJson(github.event.head_commit.message || '') }},
              "deployer": ${{ toJson(github.actor) }},
              "environment": "fea-admin",
              "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }' || true
